<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>CAOS — Cost-Aware Agent Orchestrator</title>
  <style>
    :root { font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #171717; background: #f7f7f5; }
    * { box-sizing: border-box; }
    body { margin: 0; }
    main { width: min(980px, calc(100% - 32px)); margin: 0 auto; padding: 48px 0 80px; }
    header { margin-bottom: 48px; }
    .eyebrow { font-size: 13px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #666; }
    h1 { font-size: clamp(38px, 7vw, 68px); line-height: .98; letter-spacing: -.045em; margin: 14px 0; max-width: 760px; }
    .lede { font-size: 18px; line-height: 1.55; color: #555; max-width: 680px; }
    section { background: #fff; border: 1px solid #e4e4df; border-radius: 18px; padding: 24px; margin-top: 18px; box-shadow: 0 8px 30px rgba(0,0,0,.04); }
    textarea { width: 100%; min-height: 150px; resize: vertical; border: 1px solid #cfcfc9; border-radius: 12px; padding: 16px; font: inherit; font-size: 17px; outline: none; }
    textarea:focus { border-color: #777; }
    button { border: 0; border-radius: 10px; padding: 13px 18px; font: inherit; font-weight: 700; cursor: pointer; }
    .primary { background: #171717; color: #fff; }
    .secondary { background: #ecece8; color: #171717; }
    .actions { display: flex; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
    .hidden { display: none; }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); gap: 12px; }
    .card { border: 1px solid #e4e4df; border-radius: 12px; padding: 16px; }
    .label { font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; color: #777; }
    .value { margin-top: 7px; font-size: 16px; line-height: 1.45; }
    .plan { border: 1px solid #ddd; border-radius: 14px; padding: 18px; }
    .plan h3 { margin: 0 0 12px; }
    .metric { display: flex; justify-content: space-between; gap: 16px; padding: 7px 0; border-top: 1px solid #eee; }
    .recommendation { background: #f1f1ed; border-radius: 12px; padding: 18px; }
    .error { color: #9b1c1c; background: #fff0f0; border: 1px solid #f1caca; padding: 12px; border-radius: 10px; }
    pre { white-space: pre-wrap; font: inherit; color: #555; line-height: 1.5; }
  </style>
</head>
<body>
<main>
  <header>
    <div class="eyebrow">CAOS</div>
    <h1>Build the right thing at the lowest practical cost.</h1>
    <p class="lede">Describe what you want to build. CAOS turns the idea into a blueprint, compares practical execution plans, and explains the recommendation before you decide what happens next.</p>
  </header>

  <section>
    <div class="label">Your idea</div>
    <textarea id="idea" placeholder="Example: Build a small Python API that stores customer notes and exposes a search endpoint."></textarea>
    <div class="actions">
      <button class="primary" id="planBtn">Plan with CAOS</button>
    </div>
    <div id="error" class="error hidden"></div>
  </section>

  <div id="result" class="hidden">
    <section>
      <div class="label">What CAOS understood</div>
      <h2 id="blueprint"></h2>
      <div id="assumptions" class="grid"></div>
    </section>

    <section>
      <div class="label">Plans</div>
      <div id="plans" class="grid"></div>
    </section>

    <section>
      <div class="label">CAOS recommendation</div>
      <div class="recommendation">
        <h2 id="recommendation"></h2>
        <pre id="explanation"></pre>
        <div id="reasons"></div>
      </div>
      <div class="actions">
        <button class="primary" id="buildBtn">BUILD</button>
        <button class="secondary" id="diyBtn">SHOW ME HOW</button>
      </div>
      <pre id="nextActions"></pre>
    </section>
  </div>
</main>
<script>
  const $ = (id) => document.getElementById(id);
  let currentPlan = null;

  function money(value) { return `$${Number(value || 0).toFixed(2)}`; }

  function render(data) {
    currentPlan = data;
    $('result').classList.remove('hidden');
    $('blueprint').textContent = data.blueprint_summary || 'CAOS generated a project blueprint.';
    $('assumptions').innerHTML = (data.assumptions || []).map(x => `<div class="card">${x}</div>`).join('') || '<div class="card">No additional assumptions.</div>';
    $('plans').innerHTML = (data.plans || []).map(plan => `
      <div class="plan">
        <h3>${plan.label}</h3>
        <div class="metric"><span>Cost</span><strong>${money(plan.monetary_cost)}</strong></div>
        <div class="metric"><span>Execution</span><strong>${Number(plan.execution_minutes || 0).toFixed(0)} min</strong></div>
        <div class="metric"><span>Quota wait</span><strong>${Number(plan.quota_wait_minutes || 0).toFixed(0)} min</strong></div>
      </div>`).join('') || '<div class="card">No plans returned.</div>';
    $('recommendation').textContent = data.recommendation || 'No recommendation';
    $('explanation').textContent = data.explanation || '';
    $('reasons').innerHTML = (data.reasons || []).map(x => `<div class="card">${x}</div>`).join('');
    $('nextActions').textContent = `Next: ${(data.next_actions || []).join(' · ')}`;
  }

  $('planBtn').onclick = async () => {
    const idea = $('idea').value.trim();
    $('error').classList.add('hidden');
    if (!idea) { $('error').textContent = 'Describe what you want to build first.'; $('error').classList.remove('hidden'); return; }
    $('planBtn').disabled = true; $('planBtn').textContent = 'Planning…';
    try {
      const response = await fetch('/api/v1/plan', { method: 'POST', headers: {'Content-Type':'application/json'}, body: JSON.stringify({ idea, constraints: { budget: 0, quality_threshold: 0.7, autonomy: 'controlled', prefer_free: true } }) });
      const body = await response.json();
      if (!response.ok) throw new Error(body.error || 'Planning failed');
      render(body);
    } catch (err) {
      $('error').textContent = err.message; $('error').classList.remove('hidden');
    } finally { $('planBtn').disabled = false; $('planBtn').textContent = 'Plan with CAOS'; }
  };

  $('buildBtn').onclick = () => alert('BUILD is the next execution surface. The planning result is ready to be connected to the controlled builder.');
  $('diyBtn').onclick = () => alert(currentPlan ? `DIY guidance for: ${currentPlan.idea}` : 'Plan an idea first.');
</script>
</body>
</html>
